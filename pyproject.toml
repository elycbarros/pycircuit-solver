[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuit-solver"
version = "0.1.0"
description = "Modular DC circuit analysis engine based on Modified Nodal Analysis (MNA)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pycircuit-solver contributors" }]
requires-python = ">=3.10"
keywords = ["circuit", "MNA", "nodal analysis", "Thevenin", "Op-Amp", "SPICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pycircuit = "circuit_solver.cli:main"

[project.urls]
Repository = "https://github.com/elycbarros/pycircuit-solver"

[tool.setuptools.packages.find]
where = ["."]
include = ["circuit_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["circuit_solver"]
omit = ["tests/*", "examples/*"]
